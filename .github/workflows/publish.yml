name: publish

# Two jobs (#178). `verify` runs everything that executes this repo's code -- bun install (lifecycle
# scripts), tests, the build, npm pack -- with a read-only token and NO id-token, so that code cannot
# use or leak the npm OIDC credential. It hands one packed tarball and the release notes to `publish`,
# which runs none of this repo's code: it downloads them, publishes the tarball and cuts the GitHub
# release. This does NOT make the tarball trustworthy: the code in `verify` still decides what is in
# it, and it is built from whatever commit was tagged, so who may push `*-v*` tags remains the real
# gate -- Epic #269 decision 2 / #178 -2.

on:
  push:
    tags:
      - "*-v*.*.*"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.tag.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, so the next step can tell whether the tagged commit is on main

      # A tag can be pushed on any commit, including an unreviewed branch commit. This catches the honest
      # mistake of tagging a commit that is not on main. It is NOT a security boundary: a tag runs the
      # publish.yml of the commit it points at, so someone who can push a branch and a tag can edit this
      # step away. The boundary is who may push `*-v*` tags and what npm's Trusted Publisher accepts
      # (a tag ruleset, a GitHub environment) -- Epic #269 decision 2 / #178 -2.
      - name: Verify the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not reachable from main; tag a commit that has been merged to main." >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The name and version come from the tag, which is attacker-shaped input: they go to the later
      # steps as environment variables (never spliced into a script with ${{ }}), after being checked
      # against the shapes a real tag has.
      - name: Resolve plugin name and version from the tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          if ! [[ "$NAME" =~ ^[a-z][a-z0-9-]*$ ]] || ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]*)?$ ]]; then
            echo "Tag $TAG is not <name>-v<semver>" >&2
            exit 1
          fi
          echo "PLUGIN_NAME=$NAME" >> "$GITHUB_ENV"
          echo "PLUGIN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches the package version
        run: |
          PKG_VERSION=$(node -p "require('./plugins/' + process.env.PLUGIN_NAME + '/package.json').version")
          if [ "$PKG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Tag version $PLUGIN_VERSION != package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Verify the CHANGELOG has a section for this version
        run: grep -qF "## [$PLUGIN_VERSION]" "plugins/$PLUGIN_NAME/CHANGELOG.md"

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

      # Fail before npm publish if the tagged commit's plugins.json is out of sync with the plugin
      # sources, instead of discovering it after the package is already live. What enforces this on
      # main is the generate-index CLI test in the required `test` job (`checks` is not a required
      # check); this re-check is belt-and-suspenders for a tag pushed at an unexpected commit.
      - run: bun run generate-index -- --check

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # #28: generate-index's files-allowlist guard and build-plugins' non-empty-output assert both run
      # earlier in this job -- this is the last line of defense, on the REAL tarball that `publish` will
      # upload to npm (packed here, published there unchanged).
      - name: Pack the tarball and verify what it carries
        id: pack
        run: |
          mkdir release
          (cd "plugins/$PLUGIN_NAME" && npm pack --pack-destination "$GITHUB_WORKSPACE/release")
          TARBALL=$(cd release && ls -- *.tgz)
          if [ "$(printf '%s\n' "$TARBALL" | wc -l)" != "1" ]; then
            echo "Expected exactly one tarball in release/, got: $TARBALL" >&2
            exit 1
          fi
          HAS_ADMIN=$(node -p "require('./plugins/' + process.env.PLUGIN_NAME + '/package.json').botPlugin?.adminApiVersion !== undefined")
          if [ "$HAS_ADMIN" = "true" ]; then
            tar -tzf "release/$TARBALL" > tarball-files.txt
            if ! grep -qx "package/dist/admin.js" tarball-files.txt; then
              echo "plugins/$PLUGIN_NAME: declares adminApiVersion but the tarball does not carry dist/admin.js" >&2
              exit 1
            fi
          fi
          PACKED=$(tar -xzOf "release/$TARBALL" package/package.json | node -p "const p = JSON.parse(require('fs').readFileSync(0, 'utf8')); p.name + '@' + p.version")
          if [ "$PACKED" != "@rackbops/plugin-$PLUGIN_NAME@$PLUGIN_VERSION" ]; then
            echo "Tarball package.json is $PACKED, expected @rackbops/plugin-$PLUGIN_NAME@$PLUGIN_VERSION" >&2
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Extract the CHANGELOG section for the release body
        run: |
          awk -v heading="## [$PLUGIN_VERSION]" 'index($0, heading) == 1 {flag=1; next} /^## / || /^\[[^]]+\]:[ \t]*[^ \t]/ {flag=0} flag' \
            "plugins/$PLUGIN_NAME/CHANGELOG.md" > release/release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC trusted publishing to npm (no NPM_TOKEN)
    env:
      PLUGIN_NAME: ${{ needs.verify.outputs.name }}
      PLUGIN_VERSION: ${{ needs.verify.outputs.version }}
      TARBALL: ${{ needs.verify.outputs.tarball }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: npm install -g "npm@^11.5.1"

      # Publishing uses OIDC trusted publishing, not a token: npm revoked classic tokens (2025-12-09)
      # and retired bypass-2FA CI tokens (2026-07-31). `bun publish` does not support OIDC
      # (oven-sh/bun#22423), so the publish step runs `npm publish`; install/test/build stay on Bun in
      # `verify`. A Trusted Publisher for each package must be configured on npmjs.com
      # (GitHub Actions / Rackbops / rackbops-bot-plugins / publish.yml) — see README.md.
      # `verify` already checked the tarball, but its code could have swapped the artifact afterwards, and
      # re-reading name and version here needs no repo code (just tar and node).
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          if ! [[ "$TARBALL" =~ ^[A-Za-z0-9._+-]+\.tgz$ ]]; then
            echo "Unexpected tarball name: $TARBALL" >&2
            exit 1
          fi
          PACKED=$(tar -xzOf "release/$TARBALL" package/package.json | node -p "const p = JSON.parse(require('fs').readFileSync(0, 'utf8')); p.name + '@' + p.version")
          if [ "$PACKED" != "@rackbops/plugin-$PLUGIN_NAME@$PLUGIN_VERSION" ]; then
            echo "Tarball package.json is $PACKED, expected @rackbops/plugin-$PLUGIN_NAME@$PLUGIN_VERSION" >&2
            exit 1
          fi
          # "./" matters: npm reads a bare "release/x.tgz" as the GitHub shorthand owner/repo and tries to
          # git-clone ssh://git@github.com/release/x.tgz.git (the first publish run, 2026-10-17, died there).
          npm publish "./release/$TARBALL" --access public

      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
