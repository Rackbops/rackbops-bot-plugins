name: publish

on:
  push:
    tags:
      - "*-v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC trusted publishing to npm (no NPM_TOKEN)
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Resolve plugin name and version from the tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches the package version
        run: |
          PKG_VERSION=$(node -p "require('./plugins/${{ steps.tag.outputs.name }}/package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "Tag version ${{ steps.tag.outputs.version }} != package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Verify the CHANGELOG has a section for this version
        run: grep -qF "## [${{ steps.tag.outputs.version }}]" "plugins/${{ steps.tag.outputs.name }}/CHANGELOG.md"

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

      # Fail before npm publish if the tagged commit's plugins.json is out of sync with the plugin
      # sources, instead of discovering it after the package is already live. `checks` on every PR
      # already enforces this, so under branch protection a synced index is guaranteed on main before
      # any tag; this is belt-and-suspenders for a tag pushed at an unexpected commit.
      - run: bun run generate-index -- --check

      # Publishing uses OIDC trusted publishing, not a token: npm revoked classic tokens (2025-12-09)
      # and retired bypass-2FA CI tokens (2026-07-31). `bun publish` does not support OIDC
      # (oven-sh/bun#22423), so the publish step runs `npm publish`; install/test/build stay on Bun
      # above. A Trusted Publisher for each package must be configured on npmjs.com
      # (GitHub Actions / Rackbops / rackbops-bot-plugins / publish.yml) — see README.md.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Publish to npm (OIDC trusted publishing)
        run: cd "plugins/${{ steps.tag.outputs.name }}" && npm publish --access public

      - name: Extract the CHANGELOG section for the release body
        run: |
          awk '/^## \[${{ steps.tag.outputs.version }}\]/{flag=1; next} /^## \[/{flag=0} flag' \
            "plugins/${{ steps.tag.outputs.name }}/CHANGELOG.md" > release-notes.md

      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
