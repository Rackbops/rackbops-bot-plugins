name: publish

on:
  push:
    tags:
      - "*-v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Resolve plugin name and version from the tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches the package version
        run: |
          PKG_VERSION=$(node -p "require('./plugins/${{ steps.tag.outputs.name }}/package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "Tag version ${{ steps.tag.outputs.version }} != package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Verify the CHANGELOG has a section for this version
        run: grep -qF "## [${{ steps.tag.outputs.version }}]" "plugins/${{ steps.tag.outputs.name }}/CHANGELOG.md"

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

      - name: Publish to npm
        run: cd "plugins/${{ steps.tag.outputs.name }}" && bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Regenerate plugins.json
        run: bun run generate-index

      - name: Commit plugins.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git diff --staged --quiet || git commit -m "chore: regenerate plugins.json [skip ci]"
          git push origin HEAD:main

      - name: Extract the CHANGELOG section for the release body
        run: |
          awk '/^## \[${{ steps.tag.outputs.version }}\]/{flag=1; next} /^## \[/{flag=0} flag' \
            "plugins/${{ steps.tag.outputs.name }}/CHANGELOG.md" > release-notes.md

      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
