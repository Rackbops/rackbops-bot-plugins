name: ci

# Project Operations 1.0.0, section 5 (https://lepid-labs.github.io/spec/project-operations/v1.0.0/,
# CC BY 4.0, Lepid Labs): the jobs run this repo's Justfile recipes, and `lint` and `test` are the
# names a ruleset requires.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: just install
      - run: just lint
      - run: just typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: just install
      - run: just test

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: just install
      # Typecheck here too while classic branch protection still requires `checks` (not `lint`);
      # drop it once the Project Operations ruleset replaces that protection.
      - run: just typecheck
      - run: just build
      - run: just index-check
      - run: just contract-check
